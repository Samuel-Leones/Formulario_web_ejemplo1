<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Formulario para usuarios</h1>

    <div class="container">

        <form class="form1">

            <div>
                <label for="nombre">Escribe tu nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="fecha">Fecha de nacimiento:</label>
                <input type="date" name="fecha" id="fecha" required>
            </div>
        
            <div>
                <label for="correo">Escribe tu correo electrónico:</label><br>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div>
                <label for="telefono">Número de teléfono:</label><br>
                <input type="tel" id="telefono" name="telefono" required>
            </div>

            <button type="submit">Enviar</button>
        </form>

        </div>

        <div class="container2">

            <h2>Agrupación por fieldset</h2>

            <fieldset>
                <legend>Información personal de usuarios</legend>

                <label for="nombre">Escribe tu nombre:</label>
                <input type="text" name="nombre" id="nombre" required >

                <br>

                <label for="fecha">Fecha de nacimiento:</label>
                <input type="datetime" name="fecha" id="fecha" required>

                <br>

                <label for="email">Escribe tu correo electronico:</label>
                <input type="text" name="email" id="email" required>

                <br>

                <label for="numero">Número de telefono: </label>
                <input type="number" name="numero" id="numero" required maxlength="10">

            </fieldset>

            <fieldset>
                <legend>Deportes</legend>

                <label for="deporte">Que deporte le gusta más:</label>
                <input type="radio" name="deporte" id="deporte">
                

                </select>
                
            </fieldset>
        </div>
        
</body>
</html>
